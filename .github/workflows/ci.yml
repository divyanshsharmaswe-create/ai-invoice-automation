name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
      - name: Mock end-to-end run
        run: invoice-automation --mock

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t invoice-automation .
      - run: docker run --rm invoice-automation --mock
